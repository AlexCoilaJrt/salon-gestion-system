spring.application.name=salon-gestion-api

# ==============================================================
# CONFIGURACIÓN DE BASE DE DATOS (POSTGRESQL)
# ==============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/salon_gestion_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ==============================================================
# "update" creará/actualizará las tablas automáticamente según tus Entities
spring.jpa.hibernate.ddl-auto=update
# Muestra las consultas SQL en consola
spring.jpa.show-sql=false
# Formatea el SQL para que sea más legible en consola
spring.jpa.properties.hibernate.format_sql=false
# Dejado en true para evitar LazyInitializationException (Error 500)
spring.jpa.open-in-view=true

# ==============================================================
# CONFIGURACIÓN DEL SERVIDOR
# ==============================================================
server.port=8080

# ==============================================================
# CONFIGURACIÓN JWT (RSA Keys)
# ==============================================================
# Las llaves NO van en el repositorio: se leen de esta carpeta y, si no existen, se generan solas.
# En Docker se guardan en el volumen salon_jwt_keys (/app/keys).
jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:keys/private_key.pem}
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:keys/public_key.pem}
# Expiración en milisegundos: 86400000 = 24 horas (por defecto)
jwt.expiration=86400000

# ==============================================================
# CORS (sólo necesario para 'ng serve'; en Docker el frontend usa /api por Nginx)
# ==============================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# ==============================================================
# USUARIOS INICIALES (sólo se usan al crearlos por primera vez)
# ==============================================================
app.seed.admin-password=${SEED_ADMIN_PASSWORD:admin123}
app.seed.cajero-password=${SEED_CAJERO_PASSWORD:caja123}
app.seed.barbero-password=${SEED_BARBERO_PASSWORD:juan123}

# ==============================================================
# LOGGING (Suprimir warnings)
# ==============================================================
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# ==============================================================
# CONFIGURACIÓN DE ZONA HORARIA (PERÚ UTC-5)
# ==============================================================
spring.jackson.time-zone=America/Lima
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

