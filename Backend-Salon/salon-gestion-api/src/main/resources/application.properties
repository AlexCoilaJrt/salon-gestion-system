spring.application.name=salon-gestion-api

# ==============================================================
# CONFIGURACIÓN DE BASE DE DATOS (POSTGRESQL)
# ==============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/salon_gestion_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ==============================================================
# "update" creará/actualizará las tablas automáticamente según tus Entities
spring.jpa.hibernate.ddl-auto=update
# Muestra las consultas SQL en consola
spring.jpa.show-sql=false
# Formatea el SQL para que sea más legible en consola
spring.jpa.properties.hibernate.format_sql=false
# Dejado en true para evitar LazyInitializationException (Error 500)
spring.jpa.open-in-view=true

# ==============================================================
# CONFIGURACIÓN DEL SERVIDOR
# ==============================================================
server.port=8080

# ==============================================================
# CONFIGURACIÓN JWT (RSA Keys)
# ==============================================================
jwt.private-key-path=classpath:private_key.pem
jwt.public-key-path=classpath:public_key.pem
# Expiración en milisegundos: 86400000 = 24 horas (por defecto)
jwt.expiration=86400000

# ==============================================================
# LOGGING (Suprimir warnings)
# ==============================================================
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
