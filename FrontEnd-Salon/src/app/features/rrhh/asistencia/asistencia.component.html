<div class="h-full flex items-center justify-center p-6">
  
  <div class="bg-white dark:bg-[#1e1e1e] rounded-3xl shadow-2xl overflow-hidden flex w-full max-w-4xl border border-gray-100 dark:border-gray-800">
    
    <!-- Lado izquierdo: Reloj e Info -->
    <div class="w-1/2 bg-gradient-to-br from-[#bca028] to-[#7c6717] text-white p-12 flex flex-col justify-between items-start">
      <div>
        <h1 class="text-3xl font-bold tracking-wider mb-2">Terminal de Asistencia</h1>
        <p class="text-[#e2c1c8] text-sm">Identifícate con tu DNI para iniciar o finalizar tu turno.</p>
      </div>

      <div class="mt-auto mb-8">
        <h2 class="text-6xl font-extrabold tracking-tighter mb-2">{{ currentTime }}</h2>
        <p class="text-[#e2c1c8] uppercase tracking-widest text-sm font-semibold">{{ currentDate }}</p>
      </div>
      
      <div class="flex items-center gap-2 text-sm text-[#e2c1c8] bg-black/20 px-4 py-2 rounded-full">
        <i class="pi pi-info-circle"></i>
        <span>El estado de disponibilidad se actualizará automáticamente.</span>
      </div>
    </div>

    <!-- Lado derecho: Teclado Kiosko -->
    <div class="w-1/2 p-12 bg-gray-50 dark:bg-[#161616] flex flex-col items-center justify-center relative">
      <div *ngIf="loading" class="absolute inset-0 bg-white/60 dark:bg-black/60 backdrop-blur-sm flex flex-col items-center justify-center z-10">
        <i class="pi pi-spin pi-spinner text-4xl text-[#bca028] mb-4"></i>
        <p class="font-bold text-gray-700 dark:text-gray-200">Procesando...</p>
      </div>

      <h3 class="text-xl font-bold text-gray-800 dark:text-white mb-6 text-center">Ingresa tu código o DNI</h3>
      
      <!-- Input Display -->
      <div class="w-full max-w-xs mb-8">
        <div class="bg-white dark:bg-[#2d2d2d] rounded-2xl shadow-inner border border-gray-200 dark:border-gray-700 text-center py-4 text-3xl font-mono tracking-[0.5em] text-gray-800 dark:text-white h-16 flex items-center justify-center overflow-hidden">
          {{ dniInput ? dniInput : '........' }}
        </div>
      </div>

      <!-- Keypad -->
      <div class="grid grid-cols-3 gap-4 w-full max-w-xs mb-8">
        <button *ngFor="let num of ['1','2','3','4','5','6','7','8','9']" 
                class="kiosk-btn h-16 bg-white dark:bg-[#2d2d2d] border border-gray-200 dark:border-gray-700 rounded-xl shadow-sm text-2xl font-bold text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-[#bca028]"
                (click)="appendNumber(num)">
          {{ num }}
        </button>
        <button class="kiosk-btn h-16 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-900/30 rounded-xl shadow-sm text-lg font-bold text-red-600 dark:text-red-400 hover:bg-red-100 focus:outline-none"
                (click)="clear()">
          <i class="pi pi-times"></i>
        </button>
        <button class="kiosk-btn h-16 bg-white dark:bg-[#2d2d2d] border border-gray-200 dark:border-gray-700 rounded-xl shadow-sm text-2xl font-bold text-gray-700 dark:text-gray-200 hover:bg-gray-100 focus:outline-none"
                (click)="appendNumber('0')">
          0
        </button>
        <button class="kiosk-btn h-16 bg-gray-200 dark:bg-[#3d3d3d] border border-gray-300 dark:border-gray-600 rounded-xl shadow-sm text-lg font-bold text-gray-700 dark:text-gray-300 hover:bg-gray-300 focus:outline-none"
                (click)="backspace()">
          <i class="pi pi-delete-left"></i>
        </button>
      </div>

      <!-- Acción -->
      <div class="w-full max-w-xs flex flex-col gap-3">
          <button class="w-full h-14 bg-[#bca028] hover:bg-[#d9bd72] text-white font-bold rounded-xl shadow-lg shadow-[#bca028]/30 transition-all flex items-center justify-center gap-2"
                  (click)="marcarAsistencia('ASISTENCIA')"
                  [disabled]="dniInput.length === 0"
                  [class.opacity-50]="dniInput.length === 0">
            <i class="pi pi-check-circle text-xl"></i>
            <span class="text-lg">Entrada / Salida</span>
          </button>
          
          <button class="w-full h-14 bg-[#facc15] hover:bg-[#eab308] text-gray-900 font-bold rounded-xl shadow-lg shadow-[#facc15]/30 transition-all flex items-center justify-center gap-2"
                  (click)="marcarAsistencia('DESCANSO')"
                  [disabled]="dniInput.length === 0"
                  [class.opacity-50]="dniInput.length === 0">
            <i class="pi pi-coffee text-xl"></i>
            <span class="text-lg">Tomar / Volver de Descanso</span>
          </button>
      </div>
  </div>
</div>
