<div class="h-screen w-full bg-cover bg-center relative bg-no-repeat flex items-center justify-center lg:justify-start lg:pl-24 overflow-hidden" style="background-color: #000000; background-image: url('assets/images/spa_diana_bg.jpg');">
  
  <div class="w-full sm:w-[420px] bg-black/60 backdrop-blur-lg border-t-4 border-[#bca028] sm:rounded-2xl shadow-2xl flex flex-col px-8 py-5 m-4 max-h-screen overflow-hidden">
    <!-- Header / Logo -->
    <div class="mb-2 flex justify-center">
      <img src="assets/images/logo-spa-diana.png" alt="Spa Diana Logo" class="h-20 md:h-24 object-contain drop-shadow-2xl">
    </div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col justify-center">
      <h4 class="text-white text-2xl md:text-3xl font-bold mb-1 text-center">Iniciar Sesión</h4>
      <p class="text-gray-200 mb-4 text-xs md:text-sm text-center">Ingresa tu correo electrónico y contraseña para acceder al sistema.</p>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
        <div *ngIf="errorMessage" class="text-red-400 text-sm font-semibold text-center bg-red-900/30 p-2 rounded">
          {{ errorMessage }}
        </div>

        <div>
          <label for="emailaddress" class="block text-sm font-semibold text-gray-200 mb-1.5">Correo electrónico</label>
          <input formControlName="email" class="block w-full rounded py-2 px-3 bg-white/5 border border-white/10 text-white focus:border-[#bca028] focus:outline-none focus:ring-1 focus:ring-[#bca028]" type="email" id="emailaddress" placeholder="Ingresa tu correo">
          <small *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="text-red-400 mt-1 block">Correo inválido</small>
        </div>

        <div>
          <label for="password" class="block text-sm font-semibold text-gray-200 mb-1.5">Contraseña</label>
          <div class="relative">
            <input formControlName="contrasena" class="block w-full rounded py-2 pl-3 pr-10 bg-white/5 border border-white/10 text-white focus:border-[#bca028] focus:outline-none focus:ring-1 focus:ring-[#bca028]" [type]="showPassword ? 'text' : 'password'" id="password" placeholder="Ingresa tu contraseña">
            <button type="button" (click)="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-[#bca028] focus:outline-none transition-colors">
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            </button>
          </div>
          <small *ngIf="loginForm.get('contrasena')?.invalid && loginForm.get('contrasena')?.touched" class="text-red-400 mt-1 block">Contraseña requerida</small>
        </div>

        <div class="flex justify-between items-center mt-2">
          <div class="inline-flex items-center">
            <input formControlName="rememberMe" type="checkbox" class="h-4 w-4 rounded border-white/20 bg-white/10 text-[#bca028] focus:ring-[#bca028]" id="checkbox-signin">
            <label class="text-sm ms-2 text-gray-300 select-none cursor-pointer" for="checkbox-signin">Recordarme</label>
          </div>
          <a href="#" class="text-[#bca028] hover:text-white transition-colors"><small>¿Olvidaste tu contraseña?</small></a>
        </div>

        <button [disabled]="loading" class="w-full mt-3 flex items-center justify-center px-6 py-2 bg-[#bca028] text-black font-bold rounded transition-all hover:bg-[#9d841f] disabled:opacity-50 shadow-lg" type="submit">
          {{ loading ? 'Ingresando...' : 'Ingresar' }}
        </button>

        <div class="text-center mt-4">
          <p class="text-gray-300 text-xs mb-3">O iniciar sesión con</p>
          <div class="flex items-center justify-center gap-3">
            <a href="#" class="flex-1 flex items-center justify-center py-1.5 bg-white/10 hover:bg-white/20 text-white rounded transition-colors text-xs font-medium">
              <svg class="me-2 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path>
                <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"></path>
                <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"></path>
                <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"></path>
              </svg>
              Google
            </a>
            <a href="#" class="flex-1 flex items-center justify-center py-1.5 bg-white/10 hover:bg-white/20 text-white rounded transition-colors text-xs font-medium">
              <svg class="me-2 w-4" fill="currentColor" viewBox="0 0 32 32">
                <path fill-rule="evenodd" d="M16 4C9.371 4 4 9.371 4 16c0 5.3 3.438 9.8 8.207 11.387.602.11.82-.258.82-.578 0-.286-.011-1.04-.015-2.04-3.34.723-4.043-1.609-4.043-1.609-.547-1.387-1.332-1.758-1.332-1.758-1.09-.742.082-.726.082-.726 1.203.086 1.836 1.234 1.836 1.234 1.07 1.836 2.808 1.305 3.492 1 .11-.777.422-1.305.762-1.605-2.664-.301-5.465-1.332-5.465-5.93 0-1.313.469-2.383 1.234-3.223-.121-.3-.535-1.523.117-3.175 0 0 1.008-.32 3.301 1.23A11.487 11.487 0 0116 9.805c1.02.004 2.047.136 3.004.402 2.293-1.55 3.297-1.23 3.297-1.23.656 1.652.246 2.875.12 3.175.77.84 1.231 1.91 1.231 3.223 0 4.61-2.804 5.621-5.476 5.922.43.367.812 1.101.812 2.219 0 1.605-.011 2.898-.011 3.293 0 .32.214.695.824.578C24.566 25.797 28 21.3 28 16c0-6.629-5.371-12-12-12z"></path>
              </svg>
              Github
            </a>
          </div>
        </div>
      </form>
    </div>

    <!-- Footer -->
    <div class="mt-2 text-center">
      <p class="text-xs text-gray-300">¿No tienes una cuenta? <a href="#" class="text-[#bca028] font-semibold hover:underline">Regístrate</a></p>
    </div>
  </div>
</div>
