<p-toast></p-toast>
<p-confirmDialog [style]="{width: '450px'}"></p-confirmDialog>

<div class="card p-6 bg-white dark:bg-[#1e1e1e] rounded-xl shadow-sm border border-gray-100 dark:border-gray-800">
  <div class="flex justify-between items-center mb-6">
    <div>
      <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100">Categorías</h2>
      <p class="text-sm text-gray-500 dark:text-gray-400">Administra las agrupaciones de tus servicios y productos.</p>
    </div>
    <button pButton icon="pi pi-plus" label="Nueva Categoría" class="bg-[#984b5d] hover:bg-[#7a3c4a] border-none" (click)="openNew()"></button>
  </div>

  <p-table [value]="categorias" [loading]="loading" responsiveLayout="scroll" [paginator]="true" [rows]="10" styleClass="p-datatable-sm">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th class="text-center">Estado</th>
        <th class="text-right">Acciones</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-cat>
      <tr>
        <td>{{cat.id}}</td>
        <td class="font-bold text-gray-800 dark:text-gray-200">{{cat.nombre}}</td>
        <td class="text-gray-600 dark:text-gray-400">{{cat.descripcion || '-'}}</td>
        <td class="text-center">
          <p-tag [severity]="cat.estado ? 'success' : 'danger'" [value]="cat.estado ? 'Activo' : 'Inactivo'"></p-tag>
        </td>
        <td class="text-right flex justify-end gap-2">
          <button pButton icon="pi pi-pencil" class="p-button-rounded p-button-text p-button-info" (click)="editCategoria(cat)"></button>
          <button pButton icon="pi pi-trash" class="p-button-rounded p-button-text p-button-danger" (click)="deleteCategoria(cat)"></button>
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="5" class="text-center py-8 text-gray-500">No hay categorías registradas.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog [(visible)]="categoriaDialog" [style]="{width: '450px'}" [header]="isEdit ? 'Editar Categoría' : 'Nueva Categoría'" [modal]="true" styleClass="p-fluid">
  <ng-template pTemplate="content">
    <div class="field mb-4">
      <label for="nombre" class="font-semibold block mb-2 dark:text-gray-200">Nombre</label>
      <input type="text" pInputText id="nombre" [(ngModel)]="categoria.nombre" required autofocus class="w-full" />
      <small class="p-error block mt-1" *ngIf="!categoria.nombre">El nombre es requerido.</small>
    </div>
    <div class="field mb-4">
      <label for="descripcion" class="font-semibold block mb-2 dark:text-gray-200">Descripción (Opcional)</label>
      <input type="text" pInputText id="descripcion" [(ngModel)]="categoria.descripcion" class="w-full" />
    </div>
  </ng-template>

  <ng-template pTemplate="footer">
    <button pButton label="Cancelar" icon="pi pi-times" class="p-button-text" (click)="hideDialog()"></button>
    <button pButton label="Guardar" icon="pi pi-check" class="bg-[#984b5d] hover:bg-[#7a3c4a] border-none" (click)="saveCategoria()"></button>
  </ng-template>
</p-dialog>
