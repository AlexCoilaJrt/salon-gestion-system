<aside class="w-[280px] h-full bg-white dark:bg-[#1e1e1e] border-r border-gray-200 dark:border-gray-800 flex flex-col shadow-sm transition-colors duration-300 z-20 relative">
  <!-- Logo Area -->
  <div class="h-[70px] flex items-center px-6 border-b border-gray-200 dark:border-gray-800">
    <!-- Simulación de Logo, reemplázalo con tu imagen real luego -->
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-rose-50 dark:bg-rose-900/30 flex items-center justify-center text-rose-500 dark:text-rose-400 font-bold overflow-hidden">
        <img *ngIf="empresaData()?.logoUrl; else fallbackIcon" [src]="empresaData()?.logoUrl" alt="Logo Empresa" class="w-full h-full object-cover">
        <ng-template #fallbackIcon>
          <i class="pi pi-sparkles"></i>
        </ng-template>
      </div>
      <div>
        <h1 class="font-bold text-gray-800 dark:text-gray-100 leading-tight truncate max-w-[150px]">
          {{ empresaData()?.nombreComercial || 'Cargando...' }}
        </h1>
        <p class="text-[10px] text-gray-500 dark:text-gray-400 font-medium truncate max-w-[150px]">
          {{ empresaData()?.razonSocial || '...' }}
        </p>
      </div>
    </div>
  </div>

  <!-- Menú de Navegación -->
  <div class="flex-1 overflow-y-auto py-6 px-4 custom-scrollbar">
    
    <div *ngFor="let category of filteredMenuCategories()" class="mb-6">
      <h3 class="text-xs font-semibold text-slate-500 dark:text-slate-400 mb-3 px-3 uppercase tracking-wider">
        {{ category.title }}
      </h3>
      
      <ul class="flex flex-col gap-1">
        <li *ngFor="let item of category.items">
          <a [routerLink]="item.route"
             routerLinkActive="bg-[#984b5d] text-white shadow-md"
             [routerLinkActiveOptions]="{exact: true}"
             #rla="routerLinkActive"
             class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors duration-200 text-sm font-medium"
             [ngClass]="!rla?.isActive ? 'text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-[#2d2d2d]' : ''">
            <i [class]="item.icon" class="text-lg w-5 text-center" [ngClass]="rla?.isActive ? 'text-white' : 'text-slate-400 dark:text-slate-500'"></i>
            <span>{{ item.label }}</span>
          </a>
        </li>
      </ul>
    </div>
    
  </div>
</aside>
