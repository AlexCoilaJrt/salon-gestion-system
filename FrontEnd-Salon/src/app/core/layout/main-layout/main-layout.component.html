<div class="flex h-screen bg-[#f8fafc] dark:bg-[#121212] overflow-hidden font-body text-slate-800 dark:text-gray-100 transition-colors duration-300 relative">
  
  <!-- Backdrop oscuro móvil cuando el sidebar está abierto -->
  <div *ngIf="layoutService.isMobileSidebarOpen()"
       (click)="layoutService.closeMobileSidebar()"
       class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 md:hidden transition-opacity duration-300">
  </div>

  <!-- Sidebar Izquierdo (Off-canvas en móvil, estático en Desktop) -->
  <div class="fixed inset-y-0 left-0 z-50 transition-transform duration-300 ease-in-out md:relative md:translate-x-0 shrink-0 h-full"
       [ngClass]="layoutService.isMobileSidebarOpen() ? 'translate-x-0 shadow-2xl' : '-translate-x-full md:translate-x-0'">
    <app-sidebar></app-sidebar>
  </div>

  <!-- Contenedor Principal (Header + Contenido) -->
  <div class="flex-1 flex flex-col min-w-0 w-full overflow-hidden">
    <!-- Header Superior -->
    <app-header></app-header>

    <!-- Área de Contenido Dinámico (Tablas, Dashboards) -->
    <main class="flex-1 overflow-auto p-3 sm:p-4 md:p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
